name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack app source and use JSON Capacitor config
        run: |
          unzip -o Chugunny_Lord_Offline_Project.zip -d /tmp/chugunny-source
          cp -a /tmp/chugunny-source/chugunny-lord-offline/. .
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.mjs
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.chugunlord.app",
            "appName": "Чугунный Лорд",
            "webDir": "dist",
            "android": {
              "allowMixedContent": false
            }
          }
          JSON

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform and sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chugunny-lord-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
